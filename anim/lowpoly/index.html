  '6': ['.###.', '#....', '#....', '####.', '#...#', '#...#', '.###.'], '7': ['#####', '....#', '...#.', '..#..', '.#...', '.#...', '.#...'],
  '8': ['.###.', '#...#', '#...#', '.###.', '#...#', '#...#', '.###.'], '9': ['.###.', '#...#', '#...#', '.####', '....#', '....#', '.###.'],

// faces: 16x16, drawn per expression
const SKIN = LOOK.skin, SKIN_D = LOOK.skinD;

// ---------------------------------------------------------------- helpers
