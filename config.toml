# VDOs configuration. Paths are relative to the repo root unless absolute.

[paths]
raw = "media/raw"
retired = "media/raw/_retired"
inbox = "media/inbox"       # clips uploaded on github.com (already compressed; plain git, not LFS)
sounds = "sounds"         # all audio: sounds/<category>/... (music beds in sounds/music-<mood>/)
edited = "media/edited"
work = "work"              # transcripts, sampled frames, edit decisions (git-ignored)
db = "data/ledger.sqlite"  # git-ignored
reports = "reports"        # weekly reports + dashboard (committed)

[server]
port = 8787
# Public base URL that Tailscale Funnel exposes, e.g. https://my-mac.tail1234.ts.net
# Set PUBLIC_BASE_URL in .env (preferred) or here.
public_base_url = "https://raw.githubusercontent.com/Kairoapps/VDOs/publish"   # Buffer downloads videos from here

[buffer]
organization_id = "6acd0dec0ee270b5947c74de"
channels = { instagram = "6acd0e54778b240e2fe91763", tiktok = "6acd0e18778b240e2fe9157f", youtube = "6ad5c498778b240e2f557a0c" }

[posting]
# 4 TikTok / 4 Instagram / 2 YouTube Shorts a day: 4 slots, every slot goes to TikTok + Instagram,
# 2 of the 4 also go to YouTube (Buffer refuses a 3rd YouTube post in a day). Which 2 rotates daily.
posts_per_day = 4
timezone = "America/New_York"
min_gap_hours = 3.0
platforms = ["instagram", "tiktok", "youtube"]
platform_daily_max = { youtube = 2 }
# Same variant goes to every platform in a slot (one "use").
same_variant_all_platforms = true
# Used when no time-slot experiment is running (and as the fallback).
default_slots = ["08:30", "12:00", "16:00", "19:30"]   # posting window: 8:30am-8:30pm Eastern

[compress]
# The Mac shrinks every new raw clip before uploading (Ray-Ban files are ~15 Mbps HEVC, far more than a 1080p post needs).
enabled = true
width = 1080   # final videos are 1080x1920
fps = 30
crf = 23       # lower = better quality / bigger file
min_age_seconds = 60   # leave files alone while they are still being copied in

[reuse]
max_uses = 3            # lifetime uses before a clip retires
min_days_between = 1    # a clip never posts twice on the same day; otherwise reuse any time
evergreen_max_uses = 5
music_min_days_between = 5

[inventory]
heads_up_days = 7
urgent_days = 3

[render]
width = 1080
height = 1920
fps = 30
crf = 20
preset = "veryfast"
target_lufs = -14
music_bed_lufs = -26      # music level under speech (then ducked further while talking)
music_solo_lufs = -16     # music level for clips with no speech
sfx_lufs = -14            # level of the alarm bed and sound effects
mute_original = true      # always drop the camera audio; the soundtrack is the alarm/sfx (+ music)
title_size = 64           # on-screen title font size (px at 1080 wide); shrinks to fit 3 lines
title_top = 0.25          # title top edge, as a fraction of the height (moved down from 0.17 on 2026-11-22 at Chika's request)
max_voice_boost_db = 10   # clips with no speech: raise quiet camera audio by at most this much
reframe = "blurpad"       # "crop" (fill) or "blurpad" (fit + blurred background)
min_len = 12
max_len = 45

[variants]
per_clip = 3
caption_styles = ["pop", "minimal", "karaoke"]   # word-by-word styles, used when the clip has speech
hook_types = ["question", "bold_claim", "mid_action", "text_overlay"]
# Speed by how long the cut is at normal speed (see README "Speed guidelines"). Longer cut = faster.
# [up_to_seconds, [base, faster, fastest]]: the first row whose limit the cut fits under wins; each
# variant picks a level (weighted by how each level has performed), so speed is tested per length.
speed_tiers = [[15, [1.0, 1.05, 1.1]], [25, [1.05, 1.15, 1.25]], [35, [1.2, 1.3, 1.4]], [9999, [1.3, 1.4, 1.5]]]
speed_levels = ["base", "faster", "fastest"]
speed_min = 1.0                      # never slow a clip down
speed_max = 1.5                      # never faster than 1.5x

# Call to action: green text under the title. Each variant picks a mode (weighted by results).
[cta]
modes = ["none", "always", "end"]    # end = from the moment the challenge completes (at least the last 3 s)
end_min_seconds = 3.0
texts = ["comment UNSNOOZE for the app 👇", "comment \"UNSNOOZE\" and I'll send it", "comment UNSNOOZE for the link 🔗"]
color = "#2BFF4F"
size = 46

[analysis]
min_posts_per_value = 6
exploit_share = 0.7
score_age_days = 7      # compare posts at this age
early_age_days = 3

# Experiments that rotate arms evenly (least-exposed first). Several can run at once: each slot's time
# and hashtag set are assigned independently, so their effects don't mix. Remove one from "active" once
# its winner is locked in (`default_slots` / `hashtag_set.default`).
[experiments]
active = ["time_slot", "hashtag_set"]

[experiments.time_slot]
# Candidate local times; 4 are used per day (>= min_gap_hours apart), rotated for equal exposure.
arms = ["08:30", "09:30", "11:00", "12:00", "13:00", "14:30", "16:00", "17:00", "18:30", "19:30", "20:30"]   # 8:30am-8:30pm

[experiments.hashtag_set]
# Always 3-5 tags, all matching the content. 2026-11-22: swapped "student" and "discipline" for #alarmapp sets
# (#college/#pov/#5amclub were weakest or off-niche in 40 days of history; #alarmapp/#alarm/#morningroutine strongest). The same set goes to every platform in a slot.
arms = { "alarm-core" = ["#alarm", "#snooze", "#morningroutine", "#alarmclock"], "wake-up" = ["#wakeup", "#morningroutine", "#heavysleeper", "#alarm"], "snooze-pov" = ["#pov", "#snooze", "#alarm", "#relatable"], "alarm-app" = ["#alarmapp", "#alarm", "#morningroutine", "#snooze"], "app-challenge" = ["#alarmapp", "#wakeupchallenge", "#alarm", "#morningroutine"], "minimal-3" = ["#alarm", "#snooze", "#wakeup"], "heavy-sleeper-5" = ["#heavysleeper", "#cantwakeup", "#alarmclock", "#snoozebutton", "#morningroutine"] }
default = "alarm-core"

# Per-post caption tests (weighted by results, like the variant choices).
[post_captions]
styles = ["hook_cta", "relatable", "question", "comment_cta"]
emojis = ["0", "1", "2-3"]

# Content angles (set per clip in edit.json "angle"); ranked weekly and used to weight which clips post.
[angles]
values = ["challenge", "sus", "multi_challenge"]
