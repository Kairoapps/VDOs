# VDOs configuration. Paths are relative to the repo root unless absolute.

[paths]
raw = "media/raw"
retired = "media/raw/_retired"
inbox = "media/inbox"       # clips uploaded on github.com (already compressed; plain git, not LFS)
sounds = "sounds"         # all audio: sounds/<category>/... (music beds in sounds/music-<mood>/)
edited = "media/edited"
work = "work"              # transcripts, sampled frames, edit decisions (git-ignored)
db = "data/ledger.sqlite"  # git-ignored
reports = "reports"        # weekly reports + dashboard (committed)

[server]
port = 8787
# Public base URL that Tailscale Funnel exposes, e.g. https://my-mac.tail1234.ts.net
# Set PUBLIC_BASE_URL in .env (preferred) or here.
public_base_url = "https://raw.githubusercontent.com/Kairoapps/VDOs/publish"   # Buffer downloads videos from here

[buffer]
organization_id = "6acd0dec0ee270b5947c74de"
channels = { instagram = "6acd0e54778b240e2fe91763", tiktok = "6acd0e18778b240e2fe9157f", youtube = "6ad5c498778b240e2f557a0c", facebook = "6b0698338541f09ecb99dbf0" }

[posting]
# 4 slots a day, 2 of them animations (Chika, 2026-11-27; was 1-2 since 2026-11-25). Every slot goes to TikTok + Instagram Reels +
# Facebook Page Reels + YouTube Shorts. (A daily slideshow slot was tried on 2026-11-25 and dropped the same night.)
# Buffer is on a paid plan (2026-11-25). Paid-plan YouTube limit is 5 per rolling 24 h; the planner still enforces it.
posts_per_day = 4
timezone = "America/New_York"
min_gap_hours = 3.0
platforms = ["instagram", "tiktok", "youtube", "facebook"]
platform_daily_max = { youtube = 5 }
# Same variant goes to every platform in a slot (one "use").
same_variant_all_platforms = true
# Used when no time-slot experiment is running (and as the fallback).
default_slots = ["08:30", "12:00", "15:30", "19:30"]   # posting window: 8:00am-9:00pm Eastern (2026-11-25)

[compress]
# The Mac shrinks every new raw clip before uploading (Ray-Ban files are ~15 Mbps HEVC, far more than a 1080p post needs).
enabled = true
width = 1080   # final videos are 1080x1920
fps = 30
crf = 23       # lower = better quality / bigger file
min_age_seconds = 60   # leave files alone while they are still being copied in

[reuse]
max_uses = 3            # lifetime uses before a clip retires
min_days_between = 1    # a clip never posts twice on the same day; otherwise reuse any time
evergreen_max_uses = 5
music_min_days_between = 5

[inventory]
heads_up_days = 7
urgent_days = 3

[render]
width = 1080
height = 1920
fps = 30
crf = 20
preset = "veryfast"
target_lufs = -14
music_bed_lufs = -26      # music level under speech (then ducked further while talking)
music_solo_lufs = -16     # music level for clips with no speech
sfx_lufs = -14            # level of the alarm bed and sound effects
mute_original = true      # always drop the camera audio; the soundtrack is the alarm/sfx (+ music)
title_size = 56           # on-screen title font size (px at 1080 wide); max 3 lines, shrinks to fit (Chika, 2026-11-25: 64 -> 56)
title_top = 0.14          # title top edge, as a fraction of the height (Chika, 2026-11-25: moved up from 18%)
max_voice_boost_db = 10   # clips with no speech: raise quiet camera audio by at most this much
reframe = "blurpad"       # "crop" (fill) or "blurpad" (fit + blurred background)
min_len = 12
max_len = 45

[variants]
per_clip = 3
caption_styles = ["pop", "minimal", "karaoke"]   # word-by-word styles, used when the clip has speech
hook_types = ["question", "bold_claim", "mid_action", "text_overlay"]
# Speed by how long the cut is at normal speed (see README "Speed guidelines"). Longer cut = faster.
# [up_to_seconds, [base, faster, fastest]]: the first row whose limit the cut fits under wins; each
# variant picks a level (weighted by how each level has performed), so speed is tested per length.
speed_tiers = [[15, [1.0, 1.05, 1.1]], [25, [1.05, 1.15, 1.25]], [35, [1.2, 1.3, 1.4]], [9999, [1.3, 1.4, 1.5]]]
speed_levels = ["base", "faster", "fastest"]
speed_min = 1.0                      # never slow a clip down
speed_max = 1.5                      # never faster than 1.5x

# Call to action: green text under the title. Each variant picks a mode (weighted by results).
# 2026-11-25: on-screen CTA turned OFF ("comment UNSNOOZE" can't be auto-answered on TikTok/YouTube).
# To bring it back, set modes = ["none", "always", "end"].
[cta]
modes = ["none"]                     # was ["none", "always", "end"]; end = from the moment the challenge completes
end_min_seconds = 3.0
texts = ["comment UNSNOOZE for the app 👇", "comment \"UNSNOOZE\" and I'll send it", "comment UNSNOOZE for the link 🔗"]
color = "#2BFF4F"     # fallback
# A/B tested per version (weighted by results like everything else): green, yellow, white, pink
colors = ["#2BFF4F", "#FFE135", "#FFFFFF", "#FF4FA3"]
size = 46

[analysis]
min_posts_per_value = 6
exploit_share = 0.7
score_age_days = 7      # compare posts at this age
early_age_days = 3

# Experiments that rotate arms evenly (least-exposed first). Several can run at once: each slot's time
# and hashtag set are assigned independently, so their effects don't mix. Remove one from "active" once
# its winner is locked in (`default_slots` / `hashtag_set.default`).
[experiments]
active = ["time_slot", "hashtag_set"]

[experiments.time_slot]
# Candidate local times; 3 are used per day (>= min_gap_hours apart), rotated for equal exposure.
arms = ["08:00", "09:00", "09:30", "11:00", "12:00", "13:00", "14:30", "16:00", "17:00", "18:30", "19:30", "20:30", "21:00"]   # 8:00am-9:00pm

[experiments.hashtag_set]
# Always 3-5 tags, all matching the content. 2026-11-22: swapped "student" and "discipline" for #alarmapp sets
# 2026-11-25: added two sets with the branded #unsnooze tag.
# (#college/#pov/#5amclub were weakest or off-niche in 40 days of history; #alarmapp/#alarm/#morningroutine strongest). The same set goes to every platform in a slot.
arms = { "alarm-core" = ["#alarm", "#snooze", "#morningroutine", "#alarmclock"], "wake-up" = ["#wakeup", "#morningroutine", "#heavysleeper", "#alarm"], "snooze-pov" = ["#pov", "#snooze", "#alarm", "#relatable"], "alarm-app" = ["#alarmapp", "#alarm", "#morningroutine", "#snooze"], "app-challenge" = ["#alarmapp", "#wakeupchallenge", "#alarm", "#morningroutine"], "minimal-3" = ["#alarm", "#snooze", "#wakeup"], "heavy-sleeper-5" = ["#heavysleeper", "#cantwakeup", "#alarmclock", "#snoozebutton", "#morningroutine"], "unsnooze-brand" = ["#unsnooze", "#alarmapp", "#alarm", "#morningroutine"], "unsnooze-wake" = ["#unsnooze", "#wakeup", "#heavysleeper", "#snooze"] }
default = "alarm-core"

# Per-post caption tests (weighted by results, like the variant choices).
[post_captions]
styles = ["hook_cta", "relatable", "question"]   # 2026-11-25: dropped "comment_cta" (no comment CTAs)
emojis = ["0", "1", "2-3"]

# Animated videos, made in code by the nightly run (anim/, prompts/animation.md). Each day 2 of the 4 slots are animations (Chika, 2026-11-27; was 1-2).
[animation]
min_per_day = 2
max_per_day = 2
two_share = 0.5            # unused while min_per_day = max_per_day = 2
new_per_night = 1          # new animations the nightly run makes
# Styles Chika allowed (2026-11-25): low poly and zach-3d-films, leaning low poly. The weekly ranking of
# title_style anim_low_poly / anim_zach_3d nudges this.
styles = { low_poly = 1.0, zach_3d = 0.0 }   # zach_3d stays 0 until an Unsnooze version of that engine has been built and checked once
skill_repo = "https://github.com/artemnovitckii/claude-animation-skills"
skill_commit = "86f7010"   # pinned: the nightly run executes this code unattended
voice = "elevenlabs"       # needs ELEVENLABS_API_KEY + api.elevenlabs.io allowed in the cloud; otherwise captions only
elevenlabs_voice = "Jack John - Conversational and Upbeat"
# Chika, 2026-11-27: EVERY animation uses this one voice (the fire-alarm video's). The id is pinned so a name search can never
# pick someone else; don't change voice, id or model without Chika asking.
elevenlabs_voice_id = "7EzWGsX10sAS4c9m9cPf"
elevenlabs_model = "eleven_v3"
elevenlabs_stability = 1.0   # Chika, 2026-11-28: the voice sounded too enthusiastic -> same voice, steadiest delivery (0.0 expressive, 0.5 natural, 1.0 steady)
music_gain = 0.48            # Chika, 2026-11-28: background music a bit louder (was 0.34)

# Content angles (set per clip in edit.json "angle"); ranked weekly and used to weight which clips post.
[angles]
values = ["challenge", "sus", "multi_challenge", "animation"]
